<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#5b3bb5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABC Aventura" />
    <title>ABC Aventura</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>"
    />
  </head>
  <body>
    <!-- Camada de celebração (confete) -->
    <div id="confete" aria-hidden="true"></div>
    <!-- Avisos (toasts) -->
    <div id="toast" aria-hidden="true"></div>
    <!-- Mascote que reage durante os jogos -->
    <div id="mascote" class="mascote-jogo" aria-hidden="true">🦉</div>

    <!-- ============ TELA DO NOME ============ -->
    <section id="tela-nome" class="tela tela-nome">
      <div class="mascote">🦉</div>
      <p class="instrucao">Qual é o seu nome?</p>
      <div class="nome-mostrador" id="nome-mostrador"></div>
      <div class="teclado" id="teclado"></div>
      <div class="nome-acoes">
        <button class="botao-som" id="nome-apagar" aria-label="Apagar">⌫</button>
        <button class="botao-jogo c4" id="nome-pronto" disabled>Pronto ✓</button>
      </div>
    </section>

    <!-- ============ TELA INICIAL ============ -->
    <section id="tela-inicio" class="tela tela-inicio">
      <div class="mascote">🦉</div>
      <h1 class="titulo">ABC Aventura</h1>
      <p class="subtitulo" id="home-saudacao">Vamos aprender a ler brincando!</p>

      <div class="nivel-caixa" id="nivel-caixa">
        <span class="nivel-rotulo">Nível <span id="nivel-num">1</span></span>
        <div class="nivel-barra"><div id="nivel-preenchido"></div></div>
      </div>

      <div class="menu" id="menu"></div>
      <button class="link-trocar-nome" id="trocar-nome">✏️ trocar nome</button>
    </section>

    <!-- ============ JOGO: CAÇA AO SOM ============ -->
    <section id="tela-caca" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="CacaAoSom" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="feedback" id="caca-feedback"></div>
      <div class="cartas" id="caca-cartas"></div>
    </section>

    <!-- ============ JOGO: MONTA PALAVRA ============ -->
    <section id="tela-monta" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="MontaPalavra" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="monta-figura" id="monta-emoji"></div>
      <div class="alvo" id="monta-alvo"></div>
      <div class="feedback" id="monta-feedback"></div>
      <div class="pecas" id="monta-pecas"></div>
    </section>

    <!-- ============ JOGO: RIMAS ============ -->
    <section id="tela-rimas" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="Rimas" aria-label="Ouvir de novo">🔊</button>
      </header>
      <p class="instrucao">Qual rima com…</p>
      <div class="alvo-rima" id="rimas-alvo"></div>
      <div class="feedback" id="rimas-feedback"></div>
      <div class="cartas" id="rimas-cartas"></div>
    </section>

    <!-- ============ JOGO: BATE AS SÍLABAS ============ -->
    <section id="tela-bate" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="BateSilabas" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="monta-figura" id="bate-emoji"></div>
      <div class="pontos" id="bate-pontos"></div>
      <div class="feedback" id="bate-feedback"></div>
      <button class="tambor" id="bate-tambor" aria-label="Bater">🥁</button>
    </section>

    <!-- ============ JOGO: PESCARIA DE LETRAS ============ -->
    <section id="tela-pesca" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="Pescaria" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="feedback" id="pesca-feedback"></div>
      <div class="lago" id="pesca-lago"></div>
    </section>

    <!-- ============ JOGO: PAR DAS LETRAS ============ -->
    <section id="tela-par" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="ParLetras" aria-label="Ouvir de novo">🔊</button>
      </header>
      <p class="instrucao">Ache os pares: letra grande e pequena</p>
      <div class="feedback" id="par-feedback"></div>
      <div class="memoria" id="par-grade"></div>
    </section>

    <!-- ============ JOGO: QUAL SÍLABA FALTA ============ -->
    <section id="tela-silaba" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="QualSilaba" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="monta-figura" id="silaba-emoji"></div>
      <div class="alvo" id="silaba-alvo"></div>
      <div class="feedback" id="silaba-feedback"></div>
      <div class="pecas" id="silaba-opcoes"></div>
    </section>

    <!-- ============ JOGO: CAÇA À PALAVRA ============ -->
    <section id="tela-palavra" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="CacaPalavra" aria-label="Ouvir de novo">🔊</button>
      </header>
      <p class="instrucao">Onde está escrito…</p>
      <div class="feedback" id="palavra-feedback"></div>
      <div class="palavras" id="palavra-opcoes"></div>
    </section>

    <!-- ============ JOGO: DESENHA A LETRA ============ -->
    <section id="tela-desenha" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
        <button class="botao-som" data-repetir="DesenhaLetra" aria-label="Ouvir de novo">🔊</button>
      </header>
      <div class="feedback" id="desenha-feedback"></div>
      <canvas id="desenha-canvas" class="quadro"></canvas>
      <div class="quadro-botoes">
        <button class="botao-quadro" id="desenha-limpar" aria-label="Apagar">🧽</button>
        <button class="botao-quadro ok" id="desenha-pronto" aria-label="Pronto">✅</button>
      </div>
    </section>

    <!-- ============ ÁLBUM DE ADESIVOS ============ -->
    <section id="tela-album" class="tela">
      <header class="barra">
        <button class="botao-voltar" data-voltar aria-label="Voltar">🏠</button>
      </header>
      <h2 class="titulo-album">Meus Adesivos</h2>
      <div class="album-grade" id="album-grade"></div>
    </section>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/frases.js"></script>
    <script src="assets/js/progresso.js"></script>
    <script src="assets/js/audio.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      // Registra o service worker (PWA: instalável + offline).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
